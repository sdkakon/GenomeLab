version: '3.8'

services:
  genomelab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genomelab_app
    restart: unless-stopped
    ports:
      - "8000:7860"
    environment:
      - PORT=7860
      - HOST=0.0.0.0
    volumes:
      - genomelab_data:/app/workspaces

volumes:
  genomelab_data:
    driver: local
